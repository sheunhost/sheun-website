      (function() {
        try {
          var t = localStorage.getItem('ui-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;
          if (timer) clearTimeout(timer);
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18133653660';
          document.head.appendChild(script);
        }
        if (document.readyState === 'complete') {
          timer = setTimeout(loadGTM, 4000);
        } else {
          window.addEventListener('load', function() { timer = setTimeout(loadGTM, 4000); }, { once: true });
        }
        ['pointerdown', 'scroll', 'keydown', 'touchstart', 'mousemove'].forEach(function(evt) {
          window.addEventListener(evt, loadGTM, { once: true, passive: true });
        });
      })();
    </script>
