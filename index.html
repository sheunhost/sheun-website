    <!-- Critical CSS for Hero & Navbar to eliminate FOUC and ensure CLS = 0 -->
    <style id="critical-css">
      :root {
        --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-serif: 'Newsreader', Georgia, Cambria, "Times New Roman", Times, serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { font-family: var(--font-sans); scroll-behavior: smooth; overflow-x: clip; }
      body { margin: 0; padding: 0; background-color: #08090B; color: #ffffff; -webkit-font-smoothing: antialiased; }
      html.dark body { background-color: #08090B; color: #ffffff; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      
      /* Layout & Container */
      .container { width: 100%; max-width: 1280px; margin-left: auto; margin-right: auto; padding-left: 1.5rem; padding-right: 1.5rem; }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-grow { flex-grow: 1; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .fixed { position: fixed; }
      .top-0 { top: 0; }
      .left-0 { left: 0; }
      .right-0 { right: 0; }
      .z-50 { z-index: 50; }
      .z-\[100\] { z-index: 100; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .min-h-screen { min-height: 100vh; }
      .overflow-hidden { overflow: hidden; }

      /* Top accent stripe */
      .h-\[3px\] { height: 3px; }
      .bg-gradient-to-r { background-image: linear-gradient(to right, #FF6B4A, #D946EF, #6D28D9); }

      /* Navbar */
      nav.fixed {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding-top: 1.5rem;
        padding-bottom: 1.5rem;
        background-color: rgba(8, 9, 11, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      @media (min-width: 768px) {
        nav.fixed { padding-top: 1.75rem; padding-bottom: 1.75rem; }
      }
      img[src="/logo.webp"] {
        height: 5rem;
        width: 5rem;
        border-radius: 9999px;
        object-fit: cover;
        display: block;
      }
      @media (min-width: 768px) {
        img[src="/logo.webp"] { height: 6rem; width: 6rem; }
      }
      @media (min-width: 1024px) {
        img[src="/logo.webp"] { height: 7rem; width: 7rem; }
      }

      /* Hero Section */
      section.bg-navy-gradient {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding-top: 12rem;
        padding-bottom: 5rem;
        background-color: #08090B;
        color: #ffffff;
        overflow: hidden;
      }
      .grid { display: grid; }
      .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .gap-16 { gap: 4rem; }
      @media (min-width: 1024px) {
        .lg\:grid-cols-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
        .lg\:col-span-7 { grid-column: span 7 / span 7; }
        .lg\:col-span-5 { grid-column: span 5 / span 5; }
      }

      /* Hero Typography */
      h1 {
        font-size: 3rem;
        font-weight: 700;
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: #ffffff;
        margin: 0;
      }
      @media (min-width: 768px) {
        h1 { font-size: 100px; }
      }
      .font-serif { font-family: var(--font-serif); }
      .italic { font-style: italic; }
      .font-light { font-weight: 300; }
      .opacity-40 { opacity: 0.4; }
      .text-white\/60 { color: rgba(255, 255, 255, 0.6); }
      .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
      @media (min-width: 768px) {
        .md\:text-2xl { font-size: 1.5rem; line-height: 2rem; }
      }
      .leading-relaxed { line-height: 1.625; }
      .max-w-xl { max-width: 36rem; }

      /* Gradient Text */
      .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
      .text-transparent { color: transparent; -webkit-text-fill-color: transparent; }

      /* Hero Mockup Frame */
      .aspect-\[4\/5\] { aspect-ratio: 4 / 5; }
      .max-w-md { max-width: 28rem; }
      .rounded-3xl { border-radius: 1.5rem; }
      .rounded-full { border-radius: 9999px; }
      .border { border-width: 1px; }
      .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
      .bg-white\/5 { background-color: rgba(255, 255, 255, 0.05); }
      img[src="/hero-mockup.webp"] {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Buttons & Badges */
      .bg-white { background-color: #ffffff; }
      .text-navy { color: #08090B; }
      a { text-decoration: none; color: inherit; }
    </style>

    <!-- Theme initialization to prevent FOUC -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ui-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
